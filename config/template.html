<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 11pt;
    line-height: 1.5;
    color: #222;
    margin: 0;
  }
  h1, h2, h3, h4 {
    font-family: "Segoe UI Semibold", Arial, sans-serif;
    margin-top: 1.4em;
    margin-bottom: 0.5em;
  }
  h1 { border-bottom: 2px solid #ddd; padding-bottom: 4px; }
  h2 { border-bottom: 1px solid #eee; padding-bottom: 3px; }
  p { margin: 0.6em 0; }
  pre, code {
    font-family: "Consolas", "Courier New", monospace;
    background: #f5f5f5;
  }
  pre {
    padding: 10px 12px;
    border-radius: 4px;
    border: 1px solid #e0e0e0;
    overflow-x: auto;
    font-size: 9.5pt;
  }
  code {
    padding: 2px 4px;
    border-radius: 3px;
  }
  pre code {
    padding: 0;
    background: none;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    margin: 16px 0;
    font-size: 10.5pt;
  }
  th, td {
    border: 1px solid #ddd;
    text-align: left;
    padding: 6px 8px;
  }
  th {
    background-color: #eaeaea;
  }
  tr:nth-child(even) {
    background-color: #f9f9f9;
  }
  a { color: #0b5fa5; }
  blockquote {
    margin: 0.8em 0;
    padding: 0.2em 1em;
    border-left: 3px solid #ccc;
    color: #555;
  }
</style>
    <title>{{title}}</title>
</head>
<body>
{{ content }}
</body>
</html>
