[project]
name = "ConvertHtmlOrMd_in_PDF"
version = "1.1.0"
description = "This script can covert an html page, an html file or an markdown file in a pdf file, with a good page margin management"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "Sgiostra",email = "sgiostra@bitbang.com"}
]

dependencies = [
    "jinja2>=3.1.6",
    "markdown>=3.10.3",
    "playwright>=1.63.0",
    "pymdown-extensions>=12.1",
    "typer>=0.27.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
markers = [
    "slow: tests that launch a real Chromium browser via playwright",
]
